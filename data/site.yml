lede: >-
  I study how people learn with technology, and how to make that learning work
  for everyone. My lab builds and tests AI tutors, learning analytics, and
  behavioral interventions in real classrooms and online programs.

bio_short: >-
  Rene Kizilcec is an Associate Professor of Information Science at Cornell University, where he
  directs the Future of Learning Lab and the National Tutoring Observatory. He studies how people learn
  and teach with technology, from K–12 tutoring through college and into the workplace. His work has appeared in Science and PNAS
  and has been recognized with an NSF CAREER award, Sloan and Jacobs Foundation fellowships, and a
  Humboldt Foundation research award. He holds a Ph.D. from Stanford.

# The "About" text on the home page
bio:
  - >-
    Rene Kizilcec is an Associate Professor of Information Science at Cornell University, where he directs
    the [Future of Learning Lab](https://learning.cis.cornell.edu/), leads the
    [National Tutoring Observatory](https://nationaltutoringobservatory.org/), and is faculty director of the
    [AI-Ready Workforce Initiative](https://ai-ready-workforce.ai.cornell.edu/). He studies how people learn
    and teach with technology, from K–12 tutoring through college and into the workplace. As AI changes
    what it takes to learn, teach, and work well, his team designs and tests AI tutors and assessments,
    benchmarks and analytics, and interventions with schools, universities, and employers to help people keep learning
    and adapting across school and work.
  - >-
    His research has appeared in Science and the Proceedings of the National Academy of Sciences and has
    received multiple ACM best paper awards. He is a recipient of an NSF CAREER award, Alfred P. Sloan and
    Jacobs Foundation research fellowships, and the Alexander von Humboldt Foundation's Friedrich Wilhelm
    Bessel Research Award. He served as General Chair of ACM Learning at Scale and as Steering Committee
    Chair of the 2026 Festival of Learning. He holds a B.A. in Philosophy and Economics from University
    College London and an M.Sc. in Statistics and Ph.D. in Communication from Stanford.

