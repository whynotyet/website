course_descriptions:
  INFO 4100/5101: >-
    An introductory survey of educational data science methods (predictive modeling,
    classification, regression, causal inference) and learning science theories (active
    learning, metacognition, self-regulated learning). Students collect and analyze their
    own learning trace data. The course is described in more detail in a
    [book chapter on Learning Analytics Education](/wp-content/uploads/2022/09/kizilcec2022LAEducation.pdf).
  COMM/INFO 4800: >-
    A senior capstone seminar on designing, piloting, and testing behavioral science
    interventions that address social problems, combining applied quantitative methods
    with social and behavioral theory.
  INFO 6750: >-
    A PhD-level, hands-on introduction to causal inference, design of experiments, and
    open science.

