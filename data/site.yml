course_descriptions:
  INFO 1170/5170:
    text: >-
      Artificial intelligence (AI) is impacting how organizations operate, make decisions, and deliver value
      across various sectors, including education, law, creative industries, insurance, and information
      technology. This course introduces the concepts, frameworks, and real-world applications needed to
      critically analyze how AI is adopted in organizations and the effects it has on work, learning,
      well-being, and society. Students will explore both the opportunities and risks of AI, including issues
      of bias, privacy, and organizational responsibility. Weekly hands-on activities and discussions will
      give students experience auditing or prototyping AI tools using no-code or low-code platforms, and case
      studies will bring sector-specific challenges to life. A culminating project allows students to
      investigate AI in a domain of their choice and present their insights in a university-wide showcase.
    outcomes_label: Learning Objectives
    outcomes:
      - Explain core concepts, applications, and limitations of AI in organizational contexts
      - Critically analyze the benefits, risks, and ethical considerations of AI adoption across sectors
      - Apply interdisciplinary frameworks to assess AI's impact on work, learning, well-being, and society
      - Prototype and audit AI-driven tools (using no-code/low-code environments) contextualized to specific organizations or industries
      - Communicate technical and societal implications of AI effectively to varied audiences
  INFO 4100/5101:
    text: >-
      Technology is transforming the ways we learn and teach. Learning is increasingly occurring on the
      Internet or through educational software, which has led to an explosion of educational data. How can
      all of the interaction, discourse, and performance data that are generated from online courses,
      learning management systems, and student discussion forums be used to improve educational
      effectiveness and support basic research on learning? This introductory course on Learning Analytics
      provides a survey of educational data science methods (predictive modeling, classification,
      regression, causal inference, and more) and learning science theories (active learning, Bloom's
      taxonomy, metacognition, self-regulated learning, and more). Students will collect and analyze their
      own learning trace data as part of the course.
    outcomes_label: Learning Objectives
    outcomes:
      - Explain and demonstrate key insights from research in the learning sciences on how learning works
      - Select and apply methods from educational data mining and learning analytics to analyze different kinds of educational data
      - Evaluate the results of different methods for different applications
      - Compare the strengths and weaknesses of methods for different applications
      - Identify the potential benefits and risks of learning analytics for students, teachers, and institutions
    after: The course is described in more detail in this [book chapter on Learning Analytics Education](/wp-content/uploads/2023/06/Learning_Analytics_Education.pdf).
  COMM/INFO 4800:
    text: >-
      "There is nothing as practical as a good theory," Kurt Lewin wrote. Today behavioral scientists build
      on social scientific theories about human behavior to develop new intervention approaches that address
      major challenges facing our society: poverty, poor health, educational inequalities, and many more.
      This course is designed as a senior capstone seminar that equips students with the knowledge and skills
      to analyze social problems, consider the ethical implications of intervention, design and pilot
      appropriate interventions, implement and test them online, analyze and interpret the results, and
      present policy-relevant findings. The course combines applied quantitative research methods and applied
      social behavioral science theories to prepare students for careers in research, data science,
      consulting, and policy evaluation.
    outcomes_label: Learning Outcomes
    outcomes:
      - Analyze social problems in order to identify opportunities for improving social conditions
      - Create and evaluate intervention designs and implementations to change social outcomes
      - Apply quantitative research methods to analyze behavioral science interventions
      - Interpret and present the results of behavioral science interventions
      - Explain the ethical ramifications of intervening in people's lives
    after: "Student reviews: [Annie (Sp'20)](https://cals.cornell.edu/news/annie-weiss-21-understanding-gendered-portrayal-food), [Tanmay (Sp'20)](https://cals.cornell.edu/news/tanmay-bansal-21-studying-behavioral-science-interventions)."
  INFO 6750:
    text: >-
      This PhD-level research methods course provides a hands-on introduction to topics in causal inference,
      design of experiments, and open science. Topics covered: potential outcomes framework for causal
      inference, sampling distributions and randomization inference, types of random assignment, uses of
      covariate measures in inference, statistical power, approaches to non-compliance, quasi-experimental
      designs, replication, replicability, and open science practices. Short lectures, seminar discussion, and
      hands-on practice are interwoven on a weekly basis to develop applied analytic skills. The course is
      targeted at quantitative social scientists who strive to draw causal inferences in controlled lab or
      field settings and uncontrolled real-world settings. This course should be taken after completing an
      introductory course in statistics and an introductory quantitative research methods course. Ideally,
      students taking this course are already conducting (quasi-) experimental research and are looking for
      ways to improve the precision and power of their inferences.

