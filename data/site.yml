lede: >-
  I study how people learn with technology, and how to make that learning work
  for everyone. My lab builds and tests AI tutors, learning analytics, and
  behavioral interventions in real classrooms and online programs.

bio_short: >-
  Rene Kizilcec is an Associate Professor in the Bowers College of Computing and
  Information Science at Cornell University, where he directs the [Cornell Future of
  Learning Lab](https://learning.cis.cornell.edu/). Kizilcec studies behavioral, psychological, and computational aspects
  of technology in education to inform practices and policies that promote learning,
  equity, and academic and career success. His work has appeared in Science and the
  Proceedings of the National Academy of Sciences, won multiple awards, and is funded
  by the National Science Foundation, Gates Foundation, Chan Zuckerberg Initiative, and
  Jacobs Foundation. Kizilcec holds a Ph.D. in Communication and M.Sc. in Statistics
  from Stanford University.

bio_long:
  - >-
    Rene Kizilcec is an Associate Professor of Information Science, a graduate field member in
    Communication and Physics, and the founding director of the [Future of Learning Lab](https://learning.cis.cornell.edu/)
    at Cornell University. Kizilcec's research is on the use and impact of technology in formal and informal
    learning environments (college classes, online degree programs, mobile learning, professional
    development, MOOCs, and middle/high school classrooms, etc.) and scalable interventions to broaden
    participation and reduce achievement gaps. His recent work is on academic progress and algorithmic
    transparency and fairness in predictive analytics in higher education.
  - >-
    His work has been funded by the NSF, Schmidt Futures Foundation, Jacobs Foundation, and Google. His
    research has been published in Science, Science Advances, Proceedings of the National Academy of
    Sciences, Journal of Educational Psychology, Computers in Human Behavior, Computers & Education, and in
    the proceedings of leading human-computer interaction and education conferences like ACM CHI and
    Learning@Scale; his work received multiple ACM Best Paper awards. He served as General Chair (2022) and
    Program Co-Chair (2020) for the ACM Learning at Scale conference, and as Steering Committee Chair for the
    [2026 Festival of Learning](https://festival-of-learning-2026.info/) in Seoul, South Korea (co-location
    of AIED, EDM, and L@S).
  - >-
    Kizilcec received a B.A. in Philosophy and Economics from University College London, and a M.Sc. in
    Statistics and Ph.D. in Communication from Stanford, with a doctoral thesis on designing psychologically
    welcoming online learning environments, which was awarded the Nathan Maccoby Outstanding Dissertation
    Award. Prior to joining Cornell, he spent a year as a research assistant professor at Arizona State
    University and as a research director at the Stanford Graduate School of Education.
  - >-
    Kizilcec is known for his research on understanding and supporting learners in online courses. He also
    works on developing methods for the design and analysis of experiments. His recent work examined the
    consequences of social identity threat, self-regulation, trust, and cultural differences on individual
    behavior and performance using longitudinal field experiments. He leverages techniques from data mining,
    machine learning, and natural language processing to examine behavior and motivation, reveal
    heterogeneous treatment effects, and inform user-centered design.

