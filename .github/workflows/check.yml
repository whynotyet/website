name: Check pull request builds
on: pull_request
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml jinja2 markupsafe python-docx
      - run: python scripts/build_cv.py --no-pdf && python scripts/build_site.py
